<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="دیسک ترمز اسپرت و توربو شارژر">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc" />
      <stop offset="0.35" stop-color="#cfd7e4" />
      <stop offset="0.7" stop-color="#9aa5b8" />
      <stop offset="1" stop-color="#e4e9f2" />
    </linearGradient>
    <linearGradient id="discEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6c0d0" />
      <stop offset="1" stop-color="#6d7789" />
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#c2cbd9" />
      <stop offset="1" stop-color="#7f8a9c" />
    </radialGradient>
    <linearGradient id="caliper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb457" />
      <stop offset="0.55" stop-color="#F98513" />
      <stop offset="1" stop-color="#c9630a" />
    </linearGradient>
    <linearGradient id="snail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f9" />
      <stop offset="0.45" stop-color="#aab4c6" />
      <stop offset="1" stop-color="#6f7a8d" />
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#111144" stop-opacity="0.3" />
      <stop offset="1" stop-color="#111144" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd39b" />
      <stop offset="1" stop-color="#F98513" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="160" cy="158" rx="120" ry="14" fill="url(#floor)" />

  <!-- turbocharger, behind the disc -->
  <g>
    <circle cx="216" cy="92" r="46" fill="url(#snail)" />
    <circle cx="216" cy="92" r="46" fill="none" stroke="#8e99ab" stroke-width="1.4" opacity="0.8" />
    <path d="M216 50 a42 42 0 0 1 34 18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M186 66 c14-8 32-6 42 4 c10 11 6 27-8 34" fill="none" stroke="#7d8799" stroke-width="6" stroke-linecap="round" opacity="0.55" />
    <path d="M196 78 c9-6 22-4 28 4" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" />
    <circle cx="216" cy="92" r="20" fill="#39445c" />
    <circle cx="216" cy="92" r="20" fill="none" stroke="#cdd6e3" stroke-width="2" opacity="0.7" />
    <g stroke="#b8c2d2" stroke-width="3" stroke-linecap="round">
      <path d="M216 78 v7" />
      <path d="M216 106 v-7" />
      <path d="M202 92 h7" />
      <path d="M230 92 h-7" />
      <path d="M206 82 l5 5" />
      <path d="M226 102 l-5-5" />
      <path d="M226 82 l-5 5" />
      <path d="M206 102 l5-5" />
    </g>
    <circle cx="216" cy="92" r="6" fill="url(#hub)" />
    <!-- outlet pipe -->
    <path d="M256 74 c10 2 16 10 16 20 c0 12-8 20-20 22" fill="none" stroke="url(#snail)" stroke-width="10" stroke-linecap="round" />
    <path d="M256 74 c10 2 16 10 16 20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- drilled + slotted rotor -->
  <g transform="rotate(-14 128 100)">
    <ellipse cx="128" cy="100" rx="70" ry="56" fill="url(#discEdge)" />
    <ellipse cx="128" cy="100" rx="70" ry="56" fill="none" stroke="#7c8798" stroke-width="2" />
    <ellipse cx="128" cy="98" rx="64" ry="50" fill="url(#disc)" />
    <ellipse cx="128" cy="98" rx="64" ry="50" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.6" />
    <ellipse cx="128" cy="98" rx="47" ry="36" fill="none" stroke="#98a3b5" stroke-width="1.4" opacity="0.9" />
    <g fill="#8b96a8" opacity="0.85">
      <circle cx="128" cy="56" r="3.4" />
      <circle cx="164" cy="70" r="3.4" />
      <circle cx="176" cy="102" r="3.4" />
      <circle cx="156" cy="130" r="3.4" />
      <circle cx="104" cy="132" r="3.4" />
      <circle cx="82" cy="106" r="3.4" />
      <circle cx="90" cy="72" r="3.4" />
    </g>
    <g stroke="#7f8a9c" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <path d="M150 66 l14 14" />
      <path d="M96 66 l14 14" />
      <path d="M170 104 l-14 12" />
      <path d="M86 104 l14 12" />
    </g>
    <ellipse cx="128" cy="98" rx="26" ry="20" fill="url(#hub)" />
    <ellipse cx="128" cy="98" rx="26" ry="20" fill="none" stroke="#7c8798" stroke-width="1.4" />
    <g fill="#5c6675">
      <circle cx="128" cy="82" r="3" />
      <circle cx="128" cy="114" r="3" />
      <circle cx="112" cy="98" r="3" />
      <circle cx="144" cy="98" r="3" />
      <circle cx="116" cy="87" r="3" />
      <circle cx="140" cy="109" r="3" />
      <circle cx="140" cy="87" r="3" />
      <circle cx="116" cy="109" r="3" />
    </g>
    <ellipse cx="128" cy="98" rx="7" ry="5.5" fill="#eef2f8" />
  </g>

  <!-- habanero caliper -->
  <g>
    <path d="M74 66 c22-12 46-8 58 6 c7 8 6 20-3 26 c-12 8-32 6-44-4 c-11-9-16-24-11-28 z" fill="url(#caliper)" />
    <path d="M80 70 c16-8 34-6 44 4" fill="none" stroke="#ffd7a8" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M86 84 c10 6 24 8 34 4" fill="none" stroke="#a8500a" stroke-width="2" stroke-linecap="round" opacity="0.55" />
    <circle cx="92" cy="78" r="3" fill="#7a3c08" opacity="0.6" />
    <circle cx="112" cy="88" r="3" fill="#7a3c08" opacity="0.6" />
  </g>

  <!-- motion sparks -->
  <g>
    <circle cx="58" cy="120" r="12" fill="url(#spark)" />
    <circle cx="48" cy="98" r="8" fill="url(#spark)" />
    <path d="M46 124 l14-6" stroke="#F98513" stroke-width="2.6" stroke-linecap="round" />
    <path d="M40 108 l12-3" stroke="#ffb457" stroke-width="2.2" stroke-linecap="round" />
    <path d="M56 140 l12-8" stroke="#F98513" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M258 132 l12 8" stroke="#F98513" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M266 118 l10 5" stroke="#ffb457" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
