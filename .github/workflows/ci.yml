name: CI

# main is what the live site is built from, so nothing should reach it without
# typecheck, the vitest suite and a production build having passed first.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the run it supersedes pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Matches the Node version the app is developed and verified on; the repo
      # has no engines field, so this is the only place the version is pinned.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          # Keyed on package-lock.json, so an unchanged lockfile restores the
          # whole workspace install instead of re-downloading it.
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root scripts fan out across the workspaces: typecheck every package,
      # then the whole vitest suite, then the Next.js production build.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # This build proves the app compiles as production code; it is not a
      # deploy. CI has no hosted Supabase credentials, so the catalogue guard
      # is told the empty build is intentional. Real deploys pass
      # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY at build time
      # instead of this flag.
      - name: Production build
        run: npm run build
        env:
          ALLOW_EMPTY_CATALOGUE: 'true'

  # The catalogue shells are the one wiring the unit suite cannot see: a static
  # first paint that a client hook replaces with the full matching pool. These
  # specs run the real dev server against the seeded fixture catalogue (no
  # Supabase credentials), so they cover the swap, the request URL and the
  # failed/aborted fallback exactly as a browser sees them.
  e2e:
    name: e2e · catalogue shells
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium plus the OS libraries it needs; the runner has no browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright specs
        run: npm run e2e

      # Traces and screenshots are the only way to see what a failed CI run saw.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
